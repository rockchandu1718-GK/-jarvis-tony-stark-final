<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S - TONY STARK FINAL</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="grid"></div>
<div class="header"><div class="header-left">J.A.R.V.I.S - TONY STARK FINAL</div><button id="wake-btn" class="wake-pill off"><span class="dot"></span> WAKE: OFF</button></div>
<div class="hud"><div class="bracket b-tl"></div><div class="bracket b-tr"></div><div class="bracket b-bl"></div><div class="bracket b-br"></div><div id="core"><div class="ring r5"></div><div class="ring r4"></div><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><div class="orbiter"><div class="orbit-dot"></div></div><div class="orbiter o2"><div class="orbit-dot" style="background:#7af6ff"></div></div><div class="orbiter o3"><div class="orbit-dot" style="width:3px;height:3px;opacity:.6"></div></div><div class="core-inner"></div></div><div id="visualizer"><span></span><span></span><span></span><span></span><span></span></div><div class="second-orb"><div class="s-ring2"></div><div class="s-ring"></div><div class="s-core"></div></div><div id="holo-status">HOLO • STANDBY • WAKE OFF</div></div>
<div class="comms"><div class="comms-header"><span>COMMS LOG</span><span class="enc"><span class="dot"></span> ENCRYPTED</span></div><div id="chat"></div></div>
<div class="controls"><div class="input-wrap"><input id="msg" placeholder="Ask JARVIS..." autocomplete="off"/><button id="send-btn" class="icon-btn">➤</button></div><button id="mic-btn" class="icon-btn">🎤</button><button id="clear-btn" class="icon-btn">Clear</button><button id="cam-btn" class="icon-btn">📷</button><input id="img-input" type="file" accept="image/*" style="display:none"/></div>
<script src="jarvis.js"></script>
</body>
</html>
