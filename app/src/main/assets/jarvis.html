<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S - TONY STARK FINAL</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#0ff;font-family:'JetBrains Mono',monospace;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.grid{position:fixed;inset:0;z-index:1;opacity:.07;background-image:linear-gradient(rgba(0,229,255,.3) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.3) 1px,transparent 1px);background-size:60px 60px}
.header{position:relative;z-index:10;height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:linear-gradient(90deg,rgba(0,20,30,.9),rgba(0,0,0,.85));border-bottom:1px solid rgba(0,229,255,.28)}
.header-left{font-family:'Orbitron';font-size:13px;letter-spacing:.28em;color:#7dd3fc;text-shadow:0 0 12px #00e5ff;font-weight:900}
.wake-pill{display:flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;border:1px solid rgba(0,229,255,.45);background:rgba(0,12,18,.9);color:#7dd3fc;font-family:'Orbitron';font-size:11px;letter-spacing:.18em;cursor:pointer}
.wake-pill.off.dot{background:#ff2a2a;box-shadow:0 0 8px #ff2a2a}.wake-pill.on{border-color:#00ff88;color:#7CFF9A;background:rgba(0,45,15,.85);box-shadow:0 0 18px rgba(0,255,120,.45)}.wake-pill.on.dot{background:#0f0;box-shadow:0 0 12px #0f0}.dot{width:8px;height:8px;border-radius:50%}
.hud{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.bracket{position:absolute;width:30px;height:30px;border:1px solid rgba(0,229,255,.45)}.b-tl{top:14px;left:14px;border-right:0;border-bottom:0}.b-tr{top:14px;right:14px;border-left:0;border-bottom:0}.b-bl{bottom:14px;left:14px;border-right:0;border-top:0}.b-br{bottom:14px;right:14px;border-left:0;border-top:0}
#core{position:relative;width:230px;height:230px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;border:1px solid}.r1{width:152px;height:152px;border-color:rgba(0,229,255,.92);border-top-color:transparent;border-right-color:transparent;animation:spin 3s linear infinite;box-shadow:0 0 14px #00e5ff}.r2{width:172px;height:172px;border-color:rgba(0,229,255,.52);border-bottom-color:transparent;border-left-color:transparent;animation:spinR 5.5s linear infinite}.r3{width:192px;height:192px;border:1px dashed rgba(0,229,255,.32);animation:spin 12s linear infinite}.r4{width:212px;height:212px;border-color:rgba(0,229,255,.16);border-style:dotted;animation:spinR 19s linear infinite}.r5{width:232px;height:232px;border:1px solid rgba(0,229,255,.09);animation:spin 26s linear infinite}
.core-inner{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e6ffff,#7dd3fc,#00e5ff,#0066aa);box-shadow:0 0 32px #00e5ff,0 0 64px rgba(0,229,255,.65),inset 0 0 22px rgba(255,255,255,.85);animation:corePulse 2.1s ease-in-out infinite;z-index:3}
.orbiter{position:absolute;top:50%;left:50%;width:152px;height:152px;margin-left:-76px;margin-top:-76px;animation:orbit1 4.2s linear infinite}.orbiter.orbit-dot{position:absolute;top:0;left:50%;width:6px;height:6px;background:#00e5ff;border-radius:50%;box-shadow:0 0 9px #00e5ff}.orbiter.o2{width:172px;height:172px;margin-left:-86px;margin-top:-86px;animation:orbit2 6.2s linear infinite}.orbiter.o3{width:192px;height:192px;margin-left:-96px;margin-top:-96px;animation:orbit3 8.5s linear infinite}
.second-orb{position:relative;margin-top:20px;width:88px;height:88px;border-radius:50%;background:rgba(0,32,42,.85);border:1px solid rgba(0,229,255,.32);display:flex;align-items:center;justify-content:center;box-shadow:0 0 20px rgba(0,229,255,.28)}.s-ring{position:absolute;width:68px;height:68px;border-radius:50%;border:1px solid rgba(0,229,255,.42)}.s-ring2{position:absolute;width:88px;height:88px;border-radius:50%;border:1px dashed rgba(0,229,255,.22);animation:spin 11s linear infinite}.s-core{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#a0e8ff,#00e5ff);box-shadow:0 0 16px #00e5ff}
#holo-status{margin-top:20px;font-size:9px;letter-spacing:.38em;color:rgba(0,229,255,.52);font-family:'Orbitron'}
#visualizer{display:flex;align-items:end;gap:4px;height:24px;margin-top:14px;opacity:.7}#visualizer span{width:3px;background:linear-gradient(to top,#0066aa,#00e5ff);border-radius:2px;animation:eq.45s ease-in-out infinite alternate}
.comms{position:relative;z-index:10;background:linear-gradient(180deg,rgba(6,28,38,.96),rgba(0,12,18,.99));border-top:1px solid rgba(0,229,255,.28);box-shadow:0 -6px 32px rgba(0,229,255,.14);display:flex;flex-direction:column;max-height:40vh;min-height:230px}
.comms-header{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(0,44,54,.62);border-bottom:1px solid rgba(0,229,255,.18);font-family:'Orbitron';font-size:10px;letter-spacing:.24em;color:#7dd3fc}
.enc{display:flex;align-items:center;gap:6px;color:rgba(120,230,200,.85);font-size:9px}.enc.dot{background:#2ee59d;box-shadow:0 0 7px #2ee59d}
#chat{flex:1;overflow-y:auto;padding:12px;font-size:12.5px;line-height:1.65}.msg-row{margin:11px 0;display:flex;gap:10px;animation:msgIn.32s ease}.tag{font-family:'Orbitron';font-size:9px;padding:4px 9px;border-radius:5px;border:1px solid;letter-spacing:.11em;white-space:nowrap;height:fit-content}.tag.jarvis{color:#00e5ff;border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.09)}.tag.you{color:#cbd5e1;border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.07)}.bubble{flex:1;white-space:pre-wrap;word-break:break-word}.msg-ai{color:#7dd3fc;text-shadow:0 0 7px rgba(0,229,255,.42)}.msg-user{color:#e6edf2}
.controls{position:relative;z-index:10;height:60px;min-height:60px;background:#000;border-top:1px solid rgba(0,229,255,.2);display:flex;align-items:center;gap:9px;padding:9px 11px}
.input-wrap{flex:1;display:flex;align-items:center;background:rgba(9,30,36,.92);border:1px solid rgba(0,229,255,.24);border-radius:13px;padding:0 7px 0 15px;height:44px}
#msg{flex:1;background:transparent;border:0;outline:0;color:#dff8ff;font-family:'JetBrains Mono';font-size:13.5px}#msg::placeholder{color:rgba(180,220,235,.36)}
.icon-btn{width:40px;height:40px;min-width:40px;border-radius:11px;border:1px solid rgba(0,229,255,.22);background:rgba(0,229,255,.09);color:#00e5ff;display:grid;place-items:center;cursor:pointer;font-size:17px;transition:.22s}#send-btn{background:#00e5ff;color:#002027;border-color:#00e5ff;box-shadow:0 0 18px rgba(0,229,255,.62);font-weight:bold}#mic-btn.rec{background:#ff2a2a;border-color:#ff4d4d;color:#fff;animation:recPulse 1s infinite;box-shadow:0 0 20px #ff2a2a}#clear-btn{font-family:'Orbitron';font-size:10px;letter-spacing:.13em;width:auto;padding:0 15px;color:#9fb8c2}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes spinR{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes orbit1{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes orbit2{from{transform:rotate(0)}to{transform:rotate(-360deg)}}@keyframes orbit3{from{transform:rotate(120deg)}to{transform:rotate(480deg)}}@keyframes eq{0%{height:4px}100%{height:22px}}@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes msgIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="grid"></div>
<div class="header"><div class="header-left">J.A.R.V.I.S - TONY STARK FINAL</div><button id="wake-btn" class="wake-pill off"><span class="dot"></span> WAKE: OFF</button></div>
<div class="hud"><div class="bracket b-tl"></div><div class="bracket b-tr"></div><div class="bracket b-bl"></div><div class="bracket b-br"></div><div id="core"><div class="ring r5"></div><div class="ring r4"></div><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><div class="orbiter"><div class="orbit-dot"></div></div><div class="orbiter o2"><div class="orbit-dot" style="background:#7af6ff"></div></div><div class="orbiter o3"><div class="orbit-dot" style="width:3px;height:3px;opacity:.6"></div></div><div class="core-inner" id="core-inner"></div></div><div id="visualizer"><span style="height:6px"></span><span style="height:13px"></span><span style="height:19px"></span><span style="height:9px"></span><span style="height:16px"></span><span style="height:11px"></span><span style="height:15px"></span></div><div class="second-orb"><div class="s-ring2"></div><div class="s-ring"></div><div class="s-core"></div></div><div id="holo-status">HOLO • STANDBY • WAKE OFF</div></div>
<div class="comms"><div class="comms-header"><span>COMMS LOG</span><span class="enc"><span class="dot"></span> ENCRYPTED</span></div><div id="chat"></div></div>
<div class="controls"><div class="input-wrap"><input id="msg" placeholder="Ask JARVIS..." autocomplete="off"/><button id="send-btn" class="icon-btn">➤</button></div><button id="mic-btn" class="icon-btn">🎤</button><button id="clear-btn" class="icon-btn">Clear</button><button id="cam-btn" class="icon-btn">📷</button><input id="img-input" type="file" accept="image/*" style="display:none"/></div>
<script>
let API_KEY = localStorage.getItem('jarvis_key');
if(!API_KEY){ API_KEY = prompt('Enter Gemini API Key:'); if(API_KEY) localStorage.setItem('jarvis_key', API_KEY); }
const MODELS = ["gemini-2.0-flash","gemini-1.5-flash","gemini-flash-latest"];
let MEMORY = []; try{ MEMORY = JSON.parse(localStorage.getItem('jarvis_memory')||'[]').filter(m=>m&&m.role&&m.text); }catch(e){ MEMORY=[]; }
function saveMemory(){ localStorage.setItem('jarvis_memory', JSON.stringify(MEMORY)); }
let jarvisNotes = JSON.parse(localStorage.getItem('jarvis_notes')||'[]');
function saveNotes(){ localStorage.setItem('jarvis_notes', JSON.stringify(jarvisNotes)); }
var conversationMode=false; var conversationTimer=null; var conversationTimeoutMs=60000; var wakeMode=false; var wakeRec=null; var wakePaused=false;
function resetConversationTimeout(){ if(conversationTimer) clearTimeout(conversationTimer); if(conversationMode){ conversationTimer=setTimeout(()=>{ try{ endConversationMode(); }catch(e){} },conversationTimeoutMs); } }
function endConversationMode(){ conversationMode=false; if(conversationTimer){ clearTimeout(conversationTimer); conversationTimer=null; } try{ add("SYSTEM: Conversation ended","ai"); }catch(e){} wakePaused=false; document.getElementById('holo-status').innerText="HOLO • STANDBY • WAKE OFF"; if(wakeMode){ setTimeout(()=>{ try{ if(wakeMode&&!wakePaused&&wakeRec) wakeRec.start(); }catch(e){} },1000); } }
function startConversationMode(){ conversationMode=true; wakePaused=true; try{ if(wakeRec) wakeRec.stop(); }catch(e){} resetConversationTimeout(); document.getElementById('holo-status').innerText="HOLO • ACTIVE • CALL ON 📞"; }
const chat=document.getElementById('chat'); const input=document.getElementById('msg'); const micBtn=document.getElementById('mic-btn'); const clearBtn=document.getElementById('clear-btn'); const camBtn=document.getElementById('cam-btn'); const imgInput=document.getElementById('img-input'); const wakeBtn=document.getElementById('wake-btn');
if("Notification" in window && Notification.permission==="default") Notification.requestPermission();
function jarvisTimerDone(label){ const msg='టైమర్ పూర్తయింది! '+label+' అయ్యాయి.'; try{ add('J.A.R.V.I.S: '+msg,'ai'); }catch(e){} try{ speak(msg); }catch(e){} if(Notification.permission==="granted"){ try{ new Notification('J.A.R.V.I.S Timer',{body:msg}); }catch(e){} } localStorage.removeItem('jarvis_timer_end'); }
MEMORY.forEach(m=> add((m.role==='user'?'YOU: ':'J.A.R.V.I.S: ')+m.text, m.role==='user'?'user':'ai'));
async function fetchToolJson(url,options={},timeoutMs=10000){ const c=typeof AbortController==='function'?new AbortController():null; const tid=c?setTimeout(()=>c.abort(),timeoutMs):null; try{ const r=await fetch(url,{...options,...(c?{signal:c.signal}:{})}); if(!r.ok) throw new Error('Request failed ('+r.status+').'); return await r.json(); }finally{ if(tid) clearTimeout(tid); } }
async function handleTools(text){
  const t=text.toLowerCase();
  if(conversationMode && (t.includes('bye jarvis')||t.includes('end call')||t.trim()==='bye'||t.trim()==='stop')){ endConversationMode(); return 'Call ended Boss.'; }
  if(conversationMode) resetConversationTimeout();
  if(t.includes('note add')){ const note=text.replace(/note add/gi,'').trim(); if(!note) return 'Em note rayalo cheppu'; jarvisNotes.push({text:note,time:new Date().toLocaleString()}); saveNotes(); return `Note save chesa: "${note}"`; }
  if(t.includes('notes chupu')||t.includes('my notes')){ if(!jarvisNotes.length) return 'Notes emi levu'; return 'Notes:\n'+jarvisNotes.map((n,i)=>`${i+1}. ${n.text}`).join('\n'); }
  if(t.includes('battery')){ try{ if(!navigator.getBattery) return 'Battery API ledu'; const b=await navigator.getBattery(); return `Battery: ${Math.round(b.level*100)}%`; }catch(e){ return 'Battery error'; } }
  if(/open\s+youtube/i.test(t)){ window.open('https://youtube.com','_blank'); return 'Opening YouTube'; }
  if(/open\s+google/i.test(t)){ window.open('https://google.com','_blank'); return 'Opening Google'; }
  if(/\bwhat time\b/.test(t)||/^time$/i.test(t.trim())) return 'Time is '+new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit'})+' IST';
  if(t.includes('weather')){ try{ let city='Vempalle'; const cm=text.match(/weather\s+(?:in|at|for)?\s*([A-Za-z\s]+)/i); if(cm&&cm[1]) city=cm[1].trim(); let lat=14.35,lon=78.45,name=city; try{ const geo=await fetchToolJson('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1'); if(geo.results&&geo.results[0]){ lat=geo.results[0].latitude; lon=geo.results[0].longitude; name=geo.results[0].name; } }catch(e){} const w=await fetchToolJson('https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+'&current=temperature_2m'); return 'It is '+w.current.temperature_2m+'°C in '+name; }catch(e){ return 'Weather error'; } }
  if(/\bdice\b/.test(t)) return 'Rolled '+(Math.floor(Math.random()*6)+1);
  if(t.includes('timer')){ const m=t.match(/(\d+)\s*(min|sec|h)/i); if(!m) return 'Timer: timer 5 minutes'; const amt=Number(m[1]); const unit=m[2].toLowerCase(); const factor=/h/.test(unit)?3600000:/m/.test(unit)?60000:1000; const end=Date.now()+amt*factor; localStorage.setItem('jarvis_timer_end',String(end)); localStorage.setItem('jarvis_timer_label',amt+' '+unit); if(window.timerInterval) clearInterval(window.timerInterval); window.timerInterval=setInterval(()=>{ const e=Number(localStorage.getItem('jarvis_timer_end')); if(e&&Date.now()>=e){ clearInterval(window.timerInterval); add('J.A.R.V.I.S: Timer done!','ai'); speak('Timer done boss'); } },2000); return 'Timer set for '+amt+' '+unit; }
  return null;
}
async function callGemini(p){ if(!API_KEY) throw new Error('API key missing'); const contents=MEMORY.slice(-10).map(m=>({role:m.role,parts:[{text:m.text}]})); contents.push({role:'user',parts:[{text:p}]}); let lastErr; for(const m of MODELS){ try{ const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(API_KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:"You are J.A.R.V.I.S Tony Stark AI. Boss Chandu. Witty. Telugu-English mix."]}},contents:contents})}); const data=await res.json(); if(data.error){ lastErr=new Error(data.error.message); if(/quota|rate|unavailable/i.test(data.error.message)) continue; throw lastErr; } const reply=data?.candidates?.[0]?.content?.parts?.map(x=>x.text).join('\n'); if(!reply) throw new Error('Empty'); return reply; }catch(e){ lastErr=e; } } throw lastErr; }
async function askGemini(p){ add('J.A.R.V.I.S: Thinking...','ai'); try{ let toolReply=await handleTools(p); if(toolReply){ MEMORY.push({role:'user',text:p}); MEMORY.push({role:'model',text:toolReply}); saveMemory(); chat.lastChild.innerText='J.A.R.V.I.S: '+toolReply; speak(toolReply); return; } }catch(e){ chat.lastChild.innerText='J.A.R.V.I.S: Error '+e.message; return; } try{ const reply=await callGemini(p); MEMORY.push({role:'user',text:p}); MEMORY.push({role:'model',text:reply}); saveMemory(); chat.lastChild.innerText='J.A.R.V.I.S: '+reply; speak(reply); }catch(e){ chat.lastChild.innerText='J.A.R.V.I.S: ERROR '+e.message; } }
camBtn.onclick=()=>imgInput.click(); imgInput.onchange=()=>{ const f=imgInput.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{ const b64=r.result.split(',')[1]; const q=input.value.trim()||'What do you see?'; add('YOU: [IMAGE] '+q,'user'); input.value=''; askVision(b64,f.type,q); }; r.readAsDataURL(f); };
async function askVision(b64,mime,q){ add('J.A.R.V.I.S: Analyzing...','ai'); let lastErr; for(const m of MODELS){ try{ const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(API_KEY),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:q},{inline_data:{mime_type:mime,data:[STRIPPED] const data=await res.json(); if(data.error){ lastErr=new Error(data.error.message); continue; } const reply=data?.candidates?.[0]?.content?.parts?.map(x=>x.text).join('\n'); chat.lastChild.innerText='J.A.R.V.I.S: '+reply; speak(reply); return; }catch(e){ lastErr=e; } } chat.lastChild.innerText='J.A.R.V.I.S: ERROR '+lastErr.message; }
const SR=window.SpeechRecognition||window.webkitSpeechRecognition; const rec=SR?new SR():null; if(rec) rec.lang='en-US'; if(rec) rec.onresult=(e)=>{ const t=e.results[0][0].transcript; add('YOU: '+t,'user'); askGemini(t); };
micBtn.onclick=()=>{ if(!rec){ add('SYSTEM: Voice not supported','ai'); return; } try{ rec.start(); micBtn.innerText='🔴'; micBtn.classList.add('rec'); }catch(e){} }; if(rec) rec.onend=()=>{ micBtn.innerText='🎤'; micBtn.classList.remove('rec'); };
let voices=[]; function loadVoices(){ try{ voices=speechSynthesis.getVoices(); }catch(e){} } loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;
function speak(t){ t=String(t).replace(/\*\*/g,'').trim(); if(!('speechSynthesis' in window)) return; const u=new SpeechSynthesisUtterance(t); u.rate=0.9; u.pitch=0.6; const v=voices.find(v=>/en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang)); if(v){ u.voice=v; } try{ speechSynthesis.speak(u); }catch(e){} }
function sendCurrentMessage(){ const t=input.value.trim(); if(!t) return; add('YOU: '+t,'user'); input.value=''; askGemini(t); }
document.getElementById('send-btn').onclick=sendCurrentMessage; input.addEventListener('keydown',(e)=>{ if(e.key==='Enter'){ e.preventDefault(); sendCurrentMessage(); } });
clearBtn.onclick=()=>{ MEMORY=[]; saveMemory(); chat.innerHTML=''; add('SYSTEM: Memory cleared','ai'); };
function add(t,w){ const d=document.createElement('div'); d.className='msg-row'; const tag=document.createElement('div'); tag.className='tag '+(w==='user'?'you':'jarvis'); tag.innerText=w==='user'?'YOU':'J.A.R.V.I.S'; const b=document.createElement('div'); b.className='bubble '+(w==='user'?'msg-user':'msg-ai'); b.innerText=t.replace(/^YOU:\s*|^J\.A\.R\.V\.I\.S:\s*|^SYSTEM:\s*/,''); d.appendChild(tag); d.appendChild(b); chat.appendChild(d); chat.scrollTop=chat.scrollHeight; }
function setupWakeWord(){ if(!SR||!rec) return; wakeRec=new SR(); wakeRec.lang='en-US'; wakeRec.continuous=true; wakeRec.interimResults=true; wakeRec.onresult=(e)=>{ let txt=""; for(let i=e.resultIndex;i<e.results.length;i++) txt+=e.results[i][0].transcript; if(txt.toLowerCase().includes("hey jarvis")) onWakeWord(); }; wakeRec.onend=()=>{ if(wakeMode&&!wakePaused){ setTimeout(()=>{ try{ if(wakeMode&&!wakePaused) wakeRec.start(); }catch(e){} },2000); } }; }
function setWakeMode(on){ wakeMode=on; if(on){ wakeBtn.innerHTML='<span class="dot" style="background:#0f0;box-shadow:0 0 10px #0f0"></span> WAKE: ON 👂'; wakeBtn.classList.remove('off'); wakeBtn.classList.add('on'); document.getElementById('holo-status').innerText="HOLO • WAKE ON 👂"; add("SYSTEM: Wake ON! Say Hey Jarvis","ai"); speak("Wake activated"); try{ rec.stop(); }catch(e){} try{ wakeRec.start(); }catch(e){} } else { wakeBtn.innerHTML='<span class="dot"></span> WAKE: OFF'; wakeBtn.classList.remove('on'); wakeBtn.classList.add('off'); document.getElementById('holo-status').innerText="HOLO • WAKE OFF"; try{ wakeRec.stop(); }catch(e){} } }
function onWakeWord(){ if(wakePaused&&conversationMode) return; wakePaused=true; try{ wakeRec.stop(); }catch(e){} if(!conversationMode){ add("SYSTEM: Wake detected! 📞","ai"); speak("Yes boss?"); startConversationMode(); } setTimeout(()=>{ try{ rec.start(); micBtn.innerText='🔴'; micBtn.classList.add('rec'); resetConversationTimeout(); }catch(e){} },1200); }
setupWakeWord(); wakeBtn.onclick=()=>setWakeMode(!wakeMode);
let hasGreeted=false; function startupGreeting(){ if(hasGreeted) return; hasGreeted=true; const g="Good evening boss. Mark 42 HUD active. All systems online."; add('J.A.R.V.I.S: '+g,'ai'); speak(g); } window.addEventListener('load',()=>{ setTimeout(startupGreeting,1200); });
</script>
</body>
</html>
