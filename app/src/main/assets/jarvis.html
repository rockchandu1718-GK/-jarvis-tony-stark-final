<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JARVIS FINAL WORKING</title>
<style>body{margin:0;background:#000;color:#0ff;font-family:monospace;display:flex;flex-direction:column;height:100vh}.hdr{height:44px;background:#001a24;border-bottom:1px solid #0ff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px}.core{height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid #0ff}.ring{width:90px;height:90px;border:2px solid #0ff;border-top-color:transparent;border-radius:50%;animation:sp 1.2s linear infinite;box-shadow:0 0 15px #0ff}@keyframes sp{to{transform:rotate(360deg)}}#chat{flex:1;overflow-y:auto;background:#000d14;padding:10px;font-size:13px;line-height:1.6}#ct{height:66px;display:flex;gap:5px;padding:6px;background:#000;border-top:1px solid #0ff}#ct input{flex:1;background:#111;color:#0ff;border:1px solid #0ff;border-radius:10px;padding:13px;outline:none}#ct button{width:48px;height:48px;background:#002a33;color:#0ff;border:1px solid #0ff;border-radius:10px;font-size:18px}#sendBtn{background:#0ff;color:#000;font-weight:900}#ov{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999}#bx{background:#001a24;border:2px solid #0ff;border-radius:14px;padding:20px;width:86%;max-width:340px}#bx input{width:100%;box-sizing:border-box;padding:12px;background:#000;color:#0ff;border:1px solid #0ff;border-radius:8px;margin-top:12px}#bx button{width:100%;padding:13px;border-radius:8px;font-weight:900;margin-top:12px}</style>
</head><body>
<div id="ov"><div id="bx"><h3 style="color:#0ff;margin:0;text-align:center">ENTER GEMINI API KEY</h3><p style="font-size:12px;color:#0ff;text-align:center">AQ... keys work!</p><input id="apiIn" placeholder="AQ.Ab8RN6..." type="text"><button onclick="var v=document.getElementById('apiIn').value.trim(); if(!v){alert('Paste key'); return;} try{localStorage.setItem('jarvis_key',v);}catch(e){} window.API_KEY=v; document.getElementById('ov').style.display='none'; var ch=document.getElementById('chat'); var d=document.createElement('div'); d.textContent='JARVIS: Key saved! '+v.substring(0,12)+'... Ready sir.'; ch.appendChild(d); return false;" style="background:#0ff;color:#000;border:0">SAVE & START</button><button onclick="document.getElementById('ov').style.display='none'; return false;" style="background:transparent;color:#0ff;border:1px solid #0ff">SKIP - Test Time</button></div></div>
<div class="hdr"><span>J.A.R.V.I.S - TONY STARK FINAL - FIXED</span><span style="color:#0f0">● ONLINE</span></div>
<div class="core"><div class="ring"></div><div style="margin-top:10px;font-size:10px;letter-spacing:.3em">HOLO • STANDBY • NO RELOAD</div></div>
<div id="chat"></div>
<div id="ct"><input id="msg" placeholder="Ask JARVIS... Hii jarvis" type="text"><button id="sendBtn" onclick="var i=document.getElementById('msg'); var t=i.value.trim(); if(t){i.value=''; window.askJarvis(t);} return false;">➤</button><button id="micBtn">🎤</button><button onclick="document.getElementById('imgIn').click(); return false;">📷</button><button onclick="if(confirm('Reset key?')){try{localStorage.clear();}catch(e){} location.reload();} return false;">✕</button><input type="file" id="imgIn" accept="image/*" hidden></div>
<script>
window.API_KEY=localStorage.getItem('jarvis_key')||'';
var MODELS=["gemini-2.0-flash","gemini-2.0-flash-lite","gemini-flash-latest","gemini-1.5-flash-latest"];
var chat=document.getElementById('chat'),msg=document.getElementById('msg'),micBtn=document.getElementById('micBtn'),imgIn=document.getElementById('imgIn'),ov=document.getElementById('ov');
var MEMORY=[];try{MEMORY=JSON.parse(localStorage.getItem('jarvis_memory')||'[]')}catch(e){}
function add(t,w){var d=document.createElement('div');d.style.margin='8px 0';d.style.wordBreak='break-word';d.textContent=(w==='user'?'YOU: ':'JARVIS: ')+t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function saveM(){try{localStorage.setItem('jarvis_memory',JSON.stringify(MEMORY.slice(-30)));}catch(e){}}
if(window.API_KEY){ov.style.display='none';}else{ov.style.display='flex';}
MEMORY.forEach(function(m){add(m.text,m.role==='user'?'user':'ai');});
function getTime(){return new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:true})+' IST - '+new Date().toDateString();}
window.askJarvis=async function(text,imgB64){
add(text,'user');
var think=document.createElement('div');think.style.margin='8px 0';think.style.color='#ff0';think.textContent='JARVIS: Thinking...';chat.appendChild(think);chat.scrollTop=chat.scrollHeight;
try{
var tl=text.toLowerCase();
if(tl.indexOf('time now')>-1||tl.indexOf('what is time')>-1||tl.indexOf('time entha')>-1||tl.indexOf('ippudu time')>-1||tl.indexOf('what time')>-1){var t=getTime();MEMORY.push({role:'user',text:text});MEMORY.push({role:'model',text:t});saveM();think.style.color='#0ff';think.textContent='JARVIS: '+t;return;}
var key=window.API_KEY||localStorage.getItem('jarvis_key')||'';if(!key){think.textContent='ERROR: No key';ov.style.display='flex';return;}
var contents=MEMORY.slice(-8).map(function(m){return {role:m.role,parts:[{text:m.text}]};});
var parts=[{text:text}];if(imgB64){parts.push({inline_data:{mime_type:'image/jpeg',data:[STRIPPED]
contents.push({role:'user',parts:parts});
var reply=null,lastErr='unknown';
for(var i=0;i<MODELS.length;i++){var model=MODELS[i];try{var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:contents})});var data=await res.json();if(data.error){lastErr=data.error.message+' ['+model+']';continue;}var r=data.candidates&&data.candidates[0]&&data.candidates[0].content.parts?data.candidates[0].content.parts.map(function(p){return p.text;}).join('\n'):null;if(r){reply=r;break;}}catch(e){lastErr=e.message;}}
if(!reply){throw new Error(lastErr);}
MEMORY.push({role:'user',text:text});MEMORY.push({role:'model',text:reply});saveM();think.style.color='#0ff';think.textContent='JARVIS: '+reply;
}catch(e){think.style.color='#f55';think.textContent='ERROR: '+e.message;}
};
msg.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var t=this.value.trim();if(t){this.value='';window.askJarvis(t);}}});
micBtn.onclick=function(){add('Mic coming soon - type for now','ai');};
imgIn.onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var b64=r.result.split(',')[1];window.askJarvis('What do you see in this image?',b64);};r.readAsDataURL(f);};
if(window.API_KEY){setTimeout(function(){add('Mark 42 HUD active. No-reload fix ready. Type Hii jarvis','ai');},400);}
</script></body></html>
