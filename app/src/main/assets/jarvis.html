t:230px;display:flex;align-items:center;justify-content:center}.ring{position:absolute;border-radius:50%;border:1px solid}.r1{width:152px;height:152px;border-color:rgba(0,229,255,.92);border-top-color:transparent;border-right-color:transparent;animation:spin 3s linear infinite;box-shadow:0 0 14px #00e5ff}.r2{width:172px;height:172px;border-color:rgba(0,229,255,.52);border-bottom-color:transparent;border-left-color:transparent;animation:spinR 5.5s linear infinite}.r3{width:192px;height:192px;border:1px dashed rgba(0,229,255,.32);animation:spin 12s linear infinite}.r4{width:212px;height:212px;border-color:rgba(0,229,255,.16);border-style:dotted;animation:spinR 19s linear infinite}.r5{width:232px;height:232px;border:1px solid rgba(0,229,255,.09);animation:spin 26s linear infinite}.core-inner{width:112px;height:112px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#e6ffff,#7dd3fc,#00e5ff,#0066aa);box-shadow:0 0 32px #00e5ff,0 0 64px rgba(0,229,255,.65),inset 0 0 22px rgba(255,255,255,.85);animation:corePulse 2.1s ease-in-out infinite;z-index:3}.second-orb{position:relative;margin-top:20px;width:88px;height:88px;border-radius:50%;background:rgba(0,32,42,.85);border:1px solid rgba(0,229,255,.32);display:flex;align-items:center;justify-content:center}#holo-status{margin-top:20px;font-size:9px;letter-spacing:.38em;color:rgba(0,229,255,.52);font-family:'Orbitron'}#visualizer{display:flex;align-items:end;gap:4px;height:24px;margin-top:14px;opacity:.7}#visualizer span{width:3px;height:12px;background:linear-gradient(to top,#0066aa,#00e5ff);border-radius:2px;animation:eq.45s ease-in-out infinite alternate}.comms{position:relative;z-index:10;background:linear-gradient(180deg,rgba(6,28,38,.96),rgba(0,12,18,.99));border-top:1px solid rgba(0,229,255,.28);display:flex;flex-direction:column;max-height:40vh;min-height:230px}.comms-header{height:34px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:rgba(0,44,54,.62);font-family:'Orbitron';font-size:10px;color:#7dd3fc}#chat{flex:1;overflow-y:auto;padding:12px;font-size:12.5px}.msg-row{margin:11px 0;display:flex;gap:10px}.tag{font-family:'Orbitron';font-size:9px;padding:4px 9px;border-radius:5px;border:1px solid}.tag.jarvis{color:#00e5ff;border-color:rgba(0,229,255,.45);background:rgba(0,229,255,.09)}.tag.you{color:#cbd5e1;border-color:rgba(255,255,255,.16);background:rgba(255,255,255,.07)}.msg-ai{color:#7dd3fc}.msg-user{color:#e6edf2}.controls{position:relative;z-index:10;height:60px;background:#000;border-top:1px solid rgba(0,229,255,.2);display:flex;align-items:center;gap:9px;padding:9px 11px}.input-wrap{flex:1;display:flex;align-items:center;background:rgba(9,30,36,.92);border:1px solid rgba(0,229,255,.24);border-radius:13px;padding:0 7px 0 15px;height:44px}#msg{flex:1;background:transparent;border:0;outline:0;color:#dff8ff}.icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid rgba(0,229,255,.22);background:rgba(0,229,255,.09);color:#00e5ff;display:grid;place-items:center;cursor:pointer}#send-btn{background:#00e5ff;color:#002027;box-shadow:0 0 18px rgba(0,229,255,.62)}#mic-btn.rec{background:#ff2a2a;color:#fff;animation:recPulse 1s infinite}@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}@keyframes spinR{from{transform:rotate(360deg)}to{transform:rotate(0)}}@keyframes corePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}@keyframes eq{0%{height:4px}100%{height:22px}}@keyframes recPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}</style></head><body><div class="grid"></div><div class="header"><div class="header-left">J.A.R.V.I.S - TONY STARK FINAL</div><button id="wake-btn" class="wake-pill off"><span class="dot"></span> WAKE: OFF</button></div><div class="hud"><div class="bracket b-tl"></div><div class="bracket b-tr"></div><div class="bracket b-bl"></div><div class="bracket b-br"></div><div id="core"><div class="ring r5"></div><div class="ring r4"></div><div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div><div class="core-inner"></div></div><div id="visualizer"><span></span><span></span><span></span></div><div class="second-orb"><div style="width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#a0e8ff,#00e5ff)"></div></div><div id="holo-status">HOLO • STANDBY • WAKE OFF</div></div><div class="comms"><div class="comms-header"><span>COMMS LOG</span></div><div id="chat"></div></div><div class="controls"><div class="input-wrap"><input id="msg" placeholder="Ask JARVIS..."/><button id="send-btn" class="icon-btn">➤</button></div><button id="mic-btn" class="icon-btn">🎤</button><button id="clear-btn" class="icon-btn">Clear</button><button id="cam-btn" class="icon-btn">📷</button><input id="img-input" type="file" accept="image/*" style="display:none"/></div><script>let API_KEY=localStorage.getItem('jarvis_key');if(!API_KEY){API_KEY=prompt('Enter Gemini API Key:');if(API_KEY)localStorage.setItem('jarvis_key',API_KEY);}const MODELS=["gemini-2.0-flash","gemini-1.5-flash"];let MEMORY=[];try{MEMORY=JSON.parse(localStorage.getItem('jarvis_memory')||'[]')}catch(e){MEMORY=[]}function saveMemory(){localStorage.setItem('jarvis_memory',JSON.stringify(MEMORY))}let jarvisNotes=JSON.parse(localStorage.getItem('jarvis_notes')||'[]');function saveNotes(){localStorage.setItem('jarvis_notes',JSON.stringify(jarvisNotes))}var conversationMode=false,conversationTimer=null,conversationTimeoutMs=60000,wakeMode=false,wakeRec=null,wakePaused=false;function resetConversationTimeout(){if(conversationTimer)clearTimeout(conversationTimer);if(conversationMode){conversationTimer=setTimeout(()=>{try{endConversationMode()}catch(e){}},conversationTimeoutMs)}}function endConversationMode(){conversationMode=false;if(conversationTimer){clearTimeout(conversationTimer);conversationTimer=null}try{add("SYSTEM: Call ended","ai")}catch(e){}wakePaused=false;document.getElementById('holo-status').innerText="HOLO • STANDBY • WAKE OFF";if(wakeMode){setTimeout(()=>{try{if(wakeMode&&!wakePaused&&wakeRec)wakeRec.start()}catch(e){}},1000)}}function startConversationMode(){conversationMode=true;wakePaused=true;try{if(wakeRec)wakeRec.stop()}catch(e){}resetConversationTimeout();document.getElementById('holo-status').innerText="HOLO • ACTIVE • CALL ON 📞"}const chat=document.getElementById('chat'),input=document.getElementById('msg'),micBtn=document.getElementById('mic-btn'),clearBtn=document.getElementById('clear-btn'),camBtn=document.getElementById('cam-btn'),imgInput=document.getElementById('img-input'),wakeBtn=document.getElementById('wake-btn');MEMORY.forEach(m=>add((m.role==='user'?'YOU: ':'J.A.R.V.I.S: ')+m.text,m.role==='user'?'user':'ai'));async function fetchToolJson(url,opt={},t=10000){const c=typeof AbortController==='function'?new AbortController():null;const id=c?setTimeout(()=>c.abort(),t):null;try{const r=await fetch(url,{...opt,...(c?{signal:c.signal}:{})});if(!r.ok)throw new Error('Failed');return await r.json()}finally{if(id)clearTimeout(id)}}async function handleTools(text){const t=text.toLowerCase();if(conversationMode&&(t.includes('bye jarvis')||t.trim()==='bye')){endConversationMode();return'Call ended Boss.'}if(conversationMode)resetConversationTimeout();if(t.includes('note add')){const note=text.replace(/note add/gi,'').trim();if(!note)return'Em note cheppu';jarvisNotes.push({text:note,time:new Date().toLocaleString()});saveNotes();return`Note save: "${note}"`}if(t.includes('my notes')){if(!jarvisNotes.length)return'Notes levu';return'Notes:\n'+jarvisNotes.map((n,i)=>`${i+1}. ${n.text}`).join('\n')}if(t.includes('battery')){try{const b=await navigator.getBattery();return`Battery: ${Math.round(b.level*100)}%`}catch(e){return'Battery error'}}if(/open youtube/i.test(t)){window.open('https://youtube.com','_blank');return'Opening YouTube'}if(/what time/.test(t)||t.trim()==='time')return'Time: '+new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata'})+' IST';if(t.includes('weather')){try{let city='Vempalle';const m=text.match(/weather in ([A-Za-z ]+)/i);if(m)city=m[1];let lat=14.35,lon=78.45;try{const g=await fetchToolJson('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(city)+'&count=1');if(g.results&&g.results[0]){lat=g.results[0].latitude;lon=g.results[0].longitude;city=g.results[0].name}}catch(e){}const w=await fetchToolJson(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m`);return`It is ${w.current.temperature_2m}°C in ${city}`}catch(e){return'Weather error'}}if(t.includes('timer')){const m=t.match(/(\d+)\s*(min|sec)/i);if(!m)return'Timer: timer 5 minutes';const amt=Number(m[1]);const unit=m[2].toLowerCase();const f=/m/.test(unit)?60000:1000;const end=Date.now()+amt*f;localStorage.setItem('jarvis_timer_end',String(end));return`Timer set for ${amt} ${unit}`}return null}async function callGemini(p){if(!API_KEY)throw new Error('API key missing');const contents=MEMORY.slice(-10).map(m=>({role:m.role,parts:[{text:m.text}]}));contents.push({role:'user',parts:[{text:p}]});let last;for(const m of MODELS){try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({systemInstruction:{parts:[{text:"You are J.A.R.V.I.S Tony Stark AI. Boss Chandu."}]},contents})});const d=await res.json();if(d.error){last=new Error(d.error.message);continue}const reply=d?.candidates?.[0]?.content?.parts?.map(x=>x.text).join('\n');if(reply)return reply}catch(e){last=e}}throw last}async function askGemini(p){add('J.A.R.V.I.S: Thinking...','ai');try{let tr=await handleTools(p);if(tr){MEMORY.push({role:'user',text:p});MEMORY.push({role:'model',text:tr});saveMemory();chat.lastChild.innerText='J.A.R.V.I.S: '+tr;speak(tr);return}}catch(e){chat.lastChild.innerText='Error '+e.message;return}try{const r=await callGemini(p);MEMORY.push({role:'user',text:p});MEMORY.push({role:'model',text:r});saveMemory();chat.lastChild.innerText='J.A.R.V.I.S: '+r;speak(r)}catch(e){chat.lastChild.innerText='J.A.R.V.I.S: ERROR '+e.message}}camBtn.onclick=()=>imgInput.click();imgInput.onchange=()=>{const f=imgInput.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const b64=r.result.split(',')[1];const q=input.value.trim()||'What do you see?';add('YOU: [IMAGE] '+q,'user');input.value='';askVision(b64,f.type,q)};r.readAsDataURL(f)};async function askVision(b64,mime,q){add('J.A.R.V.I.S: Analyzing...','ai');let last;for(const m of MODELS){try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${API_KEY}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:q},{inline_data:{mime_type:mime,data:[STRIPPED] d=await res.json();if(d.error){last=new Error(d.error.message);continue}const reply=d?.candidates?.[0]?.content?.parts?.map(x=>x.text).join('\n');chat.lastChild.innerText='J.A.R.V.I.S: '+reply;speak(reply);return}catch(e){last=e}}chat.lastChild.innerText='ERROR '+last.message}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;const rec=SR?new SR():null;if(rec)rec.lang='en-US';if(rec)rec.onresult=(e)=>{const t=e.results[0][0].transcript;add('YOU: '+t,'user');askGemini(t)};micBtn.onclick=()=>{if(!rec){add('SYSTEM: Voice not supported','ai');return}try{rec.start();micBtn.innerText='🔴';micBtn.classList.add('rec')}catch(e){}};if(rec)rec.onend=()=>{micBtn.innerText='🎤';micBtn.classList.remove('rec')};let voices=[];function loadVoices(){try{voices=speechSynthesis.getVoices()}catch(e){}}loadVoices();speechSynthesis.onvoiceschanged=loadVoices;function speak(t){t=String(t).replace(/\*\*/g,'').trim();if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.rate=0.9;u.pitch=0.6;const v=voices.find(v=>/en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang));if(v){u.voice=v}try{speechSynthesis.speak(u)}catch(e){}}function sendCurrentMessage(){const t=input.value.trim();if(!t)return;add('YOU: '+t,'user');input.value='';askGemini(t)}document.getElementById('send-btn').onclick=sendCurrentMessage;input.addEventListener('keydown',(e)=>{if(e.key==='Enter'){e.preventDefault();sendCurrentMessage()}});clearBtn.onclick=()=>{MEMORY=[];saveMemory();chat.innerHTML='';add('SYSTEM: Cleared','ai')};function add(t,w){const d=document.createElement('div');d.className='msg-row';const tag=document.createElement('div');tag.className='tag '+(w==='user'?'you':'jarvis');tag.innerText=w==='user'?'YOU':'J.A.R.V.I.S';const b=document.createElement('div');b.className='bubble '+(w==='user'?'msg-user':'msg-ai');b.innerText=t.replace(/^YOU:\s*|^J\.A\.R\.V\.I\.S:\s*|^SYSTEM:\s*/,'');d.appendChild(tag);d.appendChild(b);chat.appendChild(d);chat.scrollTop=chat.scrollHeight}function setupWakeWord(){if(!SR||!rec)return;wakeRec=new SR();wakeRec.lang='en-US';wakeRec.continuous=true;wakeRec.interimResults=true;wakeRec.onresult=(e)=>{let txt="";for(let i=e.resultIndex;i<e.results.length;i++)txt+=e.results[i][0].transcript;if(txt.toLowerCase().includes("hey jarvis"))onWakeWord()};wakeRec.onend=()=>{if(wakeMode&&!wakePaused){setTimeout(()=>{try{if(wakeMode&&!wakePaused)wakeRec.start()}catch(e){}},2000)}}}function setWakeMode(on){wakeMode=on;if(on){wakeBtn.innerHTML='<span class="dot" style="background:#0f0"></span> WAKE: ON 👂';wakeBtn.classList.add('on');document.getElementById('holo-status').innerText="HOLO • WAKE ON 👂";add("SYSTEM: Wake ON! Say Hey Jarvis","ai");speak("Wake activated");try{rec.stop()}catch(e){}try{wakeRec.start()}catch(e){}}else{wakeBtn.innerHTML='<span class="dot"></span> WAKE: OFF';wakeBtn.classList.remove('on');document.getElementById('holo-status').innerText="HOLO • WAKE OFF";try{wakeRec.stop()}catch(e){}}}function onWakeWord(){if(wakePaused&&conversationMode)return;wakePaused=true;try{wakeRec.stop()}catch(e){}if(!conversationMode){add("SYSTEM: Wake detected! 📞","ai");speak("Yes boss?");startConversationMode()}setTimeout(()=>{try{rec.start();micBtn.innerText='🔴';micBtn.classList.add('rec');resetConversationTimeout()}catch(e){}},1200)}setupWakeWord();wakeBtn.onclick=()=>setWakeMode(!wakeMode);let hasGreeted=false;function startupGreeting(){if(hasGreeted)return;hasGreeted=true;const g="Good evening boss. Mark 42 HUD active.";add('J.A.R.V.I.S: '+g,'ai');speak(g)}window.addEventListener('load',()=>{setTimeout(startupGreeting,1200)})</script></body></html>
