<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS FIXED SEND WORKS</title>
<style>
body{background:#000;color:#0ff;font-family:monospace;margin:0;display:flex;flex-direction:column;height:100vh}
.header{height:50px;background:#001a24;border-bottom:1px solid #0ff;display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-family:Orbitron,sans-serif;font-size:11px;letter-spacing:.2em}
#core{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring{width:120px;height:120px;border:2px solid #0ff;border-top-color:transparent;border-radius:50%;animation:spin 2s linear infinite;box-shadow:0 0 20px #0ff}
@keyframes spin{to{transform:rotate(360deg)}}
#chat{height:35vh;overflow-y:auto;background:#000a14;border-top:1px solid #0ff;padding:10px;font-size:12px}
.msg{margin:6px 0}.user{color:#fff}.ai{color:#0ff}
.controls{height:56px;display:flex;gap:6px;padding:6px;background:#000;border-top:1px solid #0ff}
input{flex:1;background:#111;color:#0ff;border:1px solid #0ff;border-radius:8px;padding:10px;outline:none}
button{padding:10px 14px;background:#003344;color:#0ff;border:1px solid #0ff;border-radius:8px}
#send{background:#0ff;color:#000;font-weight:900}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99}
#box{background:#001a24;border:1px solid #0ff;border-radius:12px;padding:20px;width:90%;max-width:320px}
#box input{width:100%;margin:10px 0}
</style>
</head>
<body>
<div id="overlay"><div id="box"><h3 style="color:#0ff;text-align:center">ENTER GEMINI API KEY</h3><input id="api-in" placeholder="AIza..."><button id="api-save" style="width:100%;background:#0ff;color:#000">SAVE</button></div></div>
<div class="header"><span>J.A.R.V.I.S - TONY STARK FINAL - FIXED</span><span style="color:#0f0">● ONLINE</span></div>
<div id="core"><div class="ring"></div><div style="margin-top:20px;font-size:10px;letter-spacing:.3em">HOLO • STANDBY</div></div>
<div id="chat"></div>
<div class="controls"><input id="msg" placeholder="Ask JARVIS..."><button id="send">➤</button><button id="clear">✕</button></div>
<script>
let API_KEY=localStorage.getItem('jarvis_key')||'';
const MODELS=["gemini-2.0-flash","gemini-1.5-flash"];
const chat=document.getElementById('chat');
const input=document.getElementById('msg');
const sendBtn=document.getElementById('send');
const clearBtn=document.getElementById('clear');
const overlay=document.getElementById('overlay');
const apiIn=document.getElementById('api-in');
const apiSave=document.getElementById('api-save');
function showOverlay(){overlay.style.display='flex';}
function hideOverlay(){overlay.style.display='none';}
if(!API_KEY) showOverlay();
apiSave.onclick=()=>{const v=apiIn.value.trim();if(!v)return alert('Enter key');API_KEY=v;localStorage.setItem('jarvis_key',v);hideOverlay();add('SYSTEM: Key saved - Ready','ai');};
let MEMORY=[];try{MEMORY=JSON.parse(localStorage.getItem('jarvis_memory')||'[]')}catch(e){MEMORY=[]}
function saveMem(){localStorage.setItem('jarvis_memory',JSON.stringify(MEMORY.slice(-30)));}
function add(t,who){const d=document.createElement('div');d.className='msg '+(who==='user'?'user':'ai');d.textContent=(who==='user'?'YOU: ':'JARVIS: ')+t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
MEMORY.forEach(m=>add(m.text,m.role==='user'?'user':'ai'));
async function ask(text){
add(text,'user');
add('Thinking...','ai');
const thinking=chat.lastChild;
try{
if(!API_KEY) throw new Error('Set API key first');
const contents=MEMORY.slice(-8).map(m=>({role:m.role,parts:[{text:m.text}]}));
contents.push({role:'user',parts:[{text:text}]});
let reply=null,err=null;
for(const model of MODELS){
try{
const res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents})});
const data=await res.json();
if(data.error){err=data.error.message;continue;}
const r=data?.candidates?.[0]?.content?.parts?.map(p=>p.text).join('\n');
if(r){reply=r;break;}
}catch(e){err=e.message;}
}
if(!reply) throw new Error(err||'Gemini failed');
MEMORY.push({role:'user',text:text});MEMORY.push({role:'model',text:reply});saveMem();
thinking.textContent='JARVIS: '+reply;
}catch(e){thinking.textContent='ERROR: '+e.message; if(e.message.includes('API')) showOverlay();}
}
function sendNow(){const t=input.value.trim();if(!t)return;input.value='';ask(t);}
sendBtn.onclick=sendNow;
input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendNow();}});
clearBtn.onclick=()=>{MEMORY=[];saveMem();chat.innerHTML='';add('Cleared','ai');};
document.querySelector('.header').onclick=()=>{if(confirm('Reset API key?')){localStorage.removeItem('jarvis_key');API_KEY='';showOverlay();}};
if(API_KEY) setTimeout(()=>add('Mark 42 HUD active. Type Hello jarvis','ai'),500);
</script>
</body>
</html>
