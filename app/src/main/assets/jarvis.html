<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JARVIS AQ FIX</title>
<style>body{margin:0;background:#000;color:#0ff;font-family:monospace;display:flex;flex-direction:column;height:100vh}.hdr{height:44px;background:#001a24;border-bottom:1px solid #0ff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px}#core{height:32vh;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid #0ff}.ring{width:100px;height:100px;border:2px solid #0ff;border-top-color:transparent;border-radius:50%;animation:s 1.5s linear infinite;box-shadow:0 0 15px #0ff}@keyframes s{to{transform:rotate(360deg)}}#chat{flex:1;overflow-y:auto;background:#000d14;padding:10px;font-size:12px}#ct{height:64px;display:flex;gap:5px;padding:6px;background:#000;border-top:1px solid #0ff}#ct input{flex:1;background:#111;color:#0ff;border:1px solid #0ff;border-radius:10px;padding:12px}#ct button{width:48px;height:48px;background:#002a33;color:#0ff;border:1px solid #0ff;border-radius:10px;font-size:18px}#send{background:#0ff;color:#000;font-weight:900}#ov{position:fixed;inset:0;background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;z-index:99999}#bx{background:#001a24;border:2px solid #0ff;border-radius:14px;padding:18px;width:88%;max-width:340px}#bx input{width:100%;box-sizing:border-box;padding:12px;background:#000;color:#0ff;border:1px solid #0ff;border-radius:8px;margin-top:10px}#bx button{width:100%;box-sizing:border-box;padding:13px;border-radius:8px;font-weight:900;margin-top:10px}</style>
<script>
function saveKeyNow(){try{var el=document.getElementById('apiIn');var v=el.value.trim();if(!v){alert('Paste your key');return;}localStorage.setItem('jarvis_key',v);document.getElementById('ov').style.display='none';var c=document.getElementById('chat');var d=document.createElement('div');d.style.margin='7px 0';d.textContent='JARVIS: AQ Key saved! '+v.substring(0,12)+'... Ready sir.';c.appendChild(d);alert('✅ Key saved!');}catch(e){alert('Save error: '+e.message);}}
function skipKey(){document.getElementById('ov').style.display='none';}
function doSend(){var i=document.getElementById('msg');var t=i.value.trim();if(!t)return;i.value='';window.askJarvis(t);}
</script>
</head><body>
<div id="ov"><div id="bx"><h3 style="color:#0ff;margin:0;text-align:center">ENTER GEMINI API KEY</h3><p style="font-size:11px;color:#0ff;margin:6px 0">AQ... keys work! Paste from AI Studio</p><input id="apiIn" placeholder="AQ.Ab8RN6I..." type="text"><button onclick="saveKeyNow();return false;" style="background:#0ff;color:#000;border:0">SAVE & START</button><button onclick="skipKey();return false;" style="background:transparent;color:#0ff;border:1px solid #0ff">SKIP</button></div></div>
<div class="hdr"><span>J.A.R.V.I.S - TONY STARK FINAL - FIXED</span><span style="color:#0f0">● ONLINE</span></div>
<div id="core"><div class="ring"></div><div style="margin-top:12px;font-size:10px;letter-spacing:.3em">HOLO • STANDBY • AQ SUPPORT</div></div>
<div id="chat"></div>
<div id="ct"><input id="msg" placeholder="Ask JARVIS..."><button id="send" onclick="doSend()">➤</button><button onclick="alert('Mic: allow permission')">🎤</button><button onclick="document.getElementById('imgIn').click()">📷</button><button onclick="if(confirm('Reset key?')){localStorage.clear();location.reload();}">✕</button><input type="file" id="imgIn" accept="image/*" hidden></div>
<script>
var API_KEY=localStorage.getItem('jarvis_key')||'';var MODELS=["gemini-2.0-flash","gemini-2.0-flash-lite","gemini-flash-latest","gemini-1.5-flash-latest"];var MEMORY=[];try{MEMORY=JSON.parse(localStorage.getItem('jarvis_memory')||'[]')}catch(e){}
function add(t,w){var ch=document.getElementById('chat');var d=document.createElement('div');d.style.margin='7px 0';d.textContent=(w==='user'?'YOU: ':'JARVIS: ')+t;ch.appendChild(d);ch.scrollTop=ch.scrollHeight;}
function saveM(){try{localStorage.setItem('jarvis_memory',JSON.stringify(MEMORY.slice(-30)));}catch(e){}}
if(API_KEY){document.getElementById('ov').style.display='none';}else{document.getElementById('ov').style.display='flex';}
MEMORY.forEach(function(m){add(m.text,m.role==='user'?'user':'ai');});
function getTime(){return new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata',hour12:true})+' IST';}
window.askJarvis=async function(text,imgB64){
add(text,'user');var think=document.createElement('div');think.textContent='JARVIS: Thinking...';document.getElementById('chat').appendChild(think);
try{
var tl=text.toLowerCase();
if(tl.includes('time now')||tl.includes('what is time')||tl.includes('time entha')||tl.includes('ippudu time')){var t=getTime();MEMORY.push({role:'user',text:text});MEMORY.push({role:'model',text:t});saveM();think.textContent='JARVIS: '+t;return;}
if(!API_KEY){think.textContent='ERROR: No key';document.getElementById('ov').style.display='flex';return;}
var contents=MEMORY.slice(-8).map(function(m){return {role:m.role,parts:[{text:m.text}]};});
var parts=[{text:text}];if(imgB64)parts.push({inline_data:{mime_type:'image/jpeg',data:[STRIPPED]
contents.push({role:'user',parts:parts});
var reply=null,lastErr=null;
for(var i=0;i<MODELS.length;i++){var model=MODELS[i];try{var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent?key='+API_KEY,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:contents})});var data=await res.json();if(data.error){lastErr=data.error.message;continue;}var r=data?.candidates?.[0]?.content?.parts?.map(function(p){return p.text;}).join('\n');if(r){reply=r;break;}}catch(e){lastErr=e.message;}}
if(!reply)throw new Error(lastErr||'Failed - check API enabled');
MEMORY.push({role:'user',text:text});MEMORY.push({role:'model',text:reply});saveM();think.textContent='JARVIS: '+reply;
}catch(e){think.textContent='ERROR: '+e.message;}
};
document.getElementById('msg').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();doSend();}});
document.getElementById('imgIn').onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var b64=r.result.split(',')[1];window.askJarvis('What do you see?',b64);};r.readAsDataURL(f);};
if(API_KEY)setTimeout(function(){add('Mark 42 HUD active. AQ key support enabled.','ai');},400);
</script></body></html>
