<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JARVIS TEST SEND</title>
<style>body{margin:0;background:#000;color:#0ff;font-family:monospace;display:flex;flex-direction:column;height:100vh}.hdr{height:44px;background:#001a24;border-bottom:1px solid #0ff;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:11px}.core{height:30vh;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid #0ff}.ring{width:90px;height:90px;border:2px solid #0ff;border-top-color:transparent;border-radius:50%;animation:sp 1.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}#chat{flex:1;overflow-y:auto;background:#000d14;padding:10px;font-size:13px}#ct{height:66px;display:flex;gap:5px;padding:6px;background:#000;border-top:1px solid #0ff}#ct input{flex:1;background:#111;color:#0ff;border:1px solid #0ff;border-radius:10px;padding:13px}#ct button{width:48px;height:48px;background:#002a33;color:#0ff;border:1px solid #0ff;border-radius:10px}#sendBtn{background:#0ff;color:#000;font-weight:900}#ov{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:99999}#bx{background:#001a24;border:2px solid #0ff;border-radius:14px;padding:20px;width:86%;max-width:340px}#bx input{width:100%;padding:12px;background:#000;color:#0ff;border:1px solid #0ff;border-radius:8px;margin-top:12px}#bx button{width:100%;padding:13px;border-radius:8px;font-weight:900;margin-top:12px}</style>
</head><body>
<div id="ov"><div id="bx"><h3 style="color:#0ff;margin:0;text-align:center">ENTER API KEY</h3><input id="apiIn" placeholder="AQ..."><button onclick="var v=document.getElementById('apiIn').value.trim(); if(!v){alert('Paste');return;} try{localStorage.setItem('k',v);}catch(e){} window.KEY=v; document.getElementById('ov').style.display='none'; document.getElementById('chat').innerHTML+='<div>JARVIS: Key saved '+v.substring(0,10)+' Ready</div>'; return false;" style="background:#0ff;color:#000;border:0">SAVE</button><button onclick="document.getElementById('ov').style.display='none'; window.KEY='test'; return false;" style="background:transparent;color:#0ff;border:1px solid #0ff">SKIP</button></div></div>
<div class="hdr"><span>J.A.R.V.I.S - SEND TEST</span><span style="color:#0f0">● ONLINE</span></div>
<div class="core"><div class="ring"></div><div style="margin-top:10px;font-size:10px">HOLO • SEND TEST</div></div>
<div id="chat"></div>
<div id="ct"><input id="msg" placeholder="Type Hii jarvis"><button id="sendBtn" onclick="testSend(); return false;">➤</button><button>🎤</button><button>📷</button><button onclick="document.getElementById('chat').innerHTML=''; return false;">✕</button></div>
<script>
window.KEY=localStorage.getItem('k')||'';var chat=document.getElementById('chat');if(window.KEY){document.getElementById('ov').style.display='none'; chat.innerHTML+='<div>JARVIS: Saved key '+window.KEY.substring(0,8)+' Ready</div>';}
function testSend(){
var i=document.getElementById('msg');var t=i.value.trim();if(!t){alert('Type something');return;}
i.value='';
var d=document.createElement('div');d.textContent='YOU: '+t;chat.appendChild(d);
var d2=document.createElement('div');d2.style.color='#ff0';d2.textContent='JARVIS: Thinking for '+t+'...';chat.appendChild(d2);
chat.scrollTop=chat.scrollHeight;
setTimeout(async function(){
try{
if(t.toLowerCase().indexOf('time')>-1){d2.style.color='#0ff';d2.textContent='JARVIS: Time is '+new Date().toLocaleString('en-IN',{timeZone:'Asia/Kolkata'});return;}
var key=window.KEY||localStorage.getItem('k')||'';if(!key){d2.textContent='ERROR: No key, please SAVE';return;}
var models=["gemini-2.0-flash","gemini-2.0-flash-lite","gemini-flash-latest"];
var reply=null,err='';
for(var m=0;m<models.length;m++){
try{
var res=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+models[m]+':generateContent?key='+key,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:t}]}]})});
var data=await res.json();
if(data.error){err=data.error.message;continue;}
var r=data.candidates&&data.candidates[0]&&data.candidates[0].content.parts?data.candidates[0].content.parts.map(function(p){return p.text;}).join(''):null;
if(r){reply=r;break;}
}catch(e){err=e.message;}
}
if(reply){d2.style.color='#0ff';d2.textContent='JARVIS: '+reply;}else{d2.style.color='#f55';d2.textContent='ERROR: '+err;}
}catch(e){d2.style.color='#f55';d2.textContent='JS ERROR: '+e.message;}
},200);
}
document.getElementById('msg').addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();testSend();}});
</script></body></html>
