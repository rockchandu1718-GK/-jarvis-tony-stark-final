name: Build JARVIS SILENT APK - FIXED
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Create Android project structure
        run: |
          mkdir -p app/src/main/java/com/darkfighter/jarvis
          SRC=$(find . -name "MainActivity.kt" -type f | head -1)
          cp "$SRC" app/src/main/java/com/darkfighter/jarvis/MainActivity.kt
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.darkfighter.jarvis">
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.CALL_PHONE"/>
              <uses-permission android:name="android.permission.FLASHLIGHT"/>
              <application android:allowBackup="true" android:label="J.A.R.V.I.S SILENT">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST
          cat > app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' id 'org.jetbrains.kotlin.android' }
          android {
              namespace 'com.darkfighter.jarvis'
              compileSdk 34
              defaultConfig { applicationId "com.darkfighter.jarvis" minSdk 24 targetSdk 34 versionCode 8 versionName "8.0-SILENT-38-POINTS" }
              buildTypes { debug { minifyEnabled false } release { minifyEnabled false } }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17 targetCompatibility JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies { implementation 'androidx.core:core-ktx:1.12.0' implementation 'androidx.appcompat:appcompat:1.6.1' implementation 'com.google.android.material:material:1.11.0' }
          GRADLE
          cat > build.gradle << 'ROOT'
          plugins { id 'com.android.application' version '8.1.4' apply false id 'org.jetbrains.kotlin.android' version '1.9.10' apply false }
          ROOT
          cat > settings.gradle << 'SETTINGS'
          pluginManagement { repositories { google() mavenCentral() gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS) repositories { google() mavenCentral() } }
          include ':app'
          SETTINGS
          cat > gradle.properties << 'PROPS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          PROPS
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.5
      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      - name: Upload SILENT APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-38-POINTS-SILENT-NO-BEEP-APK
          path: app/build/outputs/apk/debug/app-debug.apk
